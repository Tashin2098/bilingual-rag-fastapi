name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-code:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install fastapi uvicorn python-multipart faiss-cpu==1.7.4 langdetect googletrans==4.0.0rc1 "numpy<2" scipy scikit-learn sentence-transformers
    
    - name: Test FastAPI import
      run: python -c "from fastapi import FastAPI; print('FastAPI OK')"
    
    - name: Test FAISS import
      run: python -c "import faiss; print('FAISS OK')"
    
    - name: Test Sentence Transformers import
      run: python -c "from sentence_transformers import SentenceTransformer; print('Sentence-Transformers OK')"
    
    - name: All tests passed
      run: echo "SUCCESS - All imports working"
