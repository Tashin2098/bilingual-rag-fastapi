name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-code:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies (lightweight)
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn python-multipart faiss-cpu==1.7.4 langdetect googletrans==4.0.0rc1 numpy scipy scikit-learn
    
    - name: Test API imports
      run: |
        python -c "from fastapi import FastAPI; print('✅ FastAPI import successful!')"
        python -c "import faiss; print('✅ FAISS import successful!')"
        python -c "from sentence_transformers import SentenceTransformer; print('✅ Sentence-Transformers import successful!')"
    
    - name: Success message
      run: echo "✅ CI pipeline passed! All imports working."
